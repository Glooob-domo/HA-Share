type: vertical-stack
cards:
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Aujourd'hui
        secondary: |-
          {{ states('sensor.rte_tempo_couleur_actuelle') }}
          {{ states('sensor.tarif_actuel_tempo_6kva_ttc') }} €/kWh
        icon: mdi:lightning-bolt
        multiline_secondary: true
        tap_action:
          action: more-info
        entity: sensor.rte_tempo_couleur_actuelle
        color: white
        vertical: true
        features_position: bottom
        card_mod:
          style: |
            ha-card {
              border: none;
              {% set color = states('sensor.rte_tempo_couleur_actuelle') %}
              {% if color == 'Rouge' %}
                background: linear-gradient(135deg, #ff5f6d 0%, #b91d1d 100%);
              {% elif color == 'Blanc' %}
                background: linear-gradient(135deg, #ffffff 0%, #d7e1ec 100%);
                --primary-text-color: #2c3e50;
              {% else %}
                background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
              {% endif %}
              box-shadow: 0 4px 15px rgba(0,0,0,0.2);
              border-radius: 15px;
              height: 140px;
            }
            ha-state-icon, .primary, .secondary {
              {% if states('sensor.rte_tempo_couleur_actuelle') == 'Blanc' %}
                color: #2c3e50 !important;
              {% else %}
                color: white !important;
              {% endif %}
            }
      - type: custom:mushroom-template-card
        primary: Demain
        secondary: >-
          {% set demain = states('sensor.rte_tempo_prochaine_couleur') %}  {% if
          demain == 'inconnu' %} En attente données RTE... {% else %} {{ demain }} {%
          endif %}
        icon: mdi:calendar-arrow-right
        layout: vertical
        multiline_secondary: true
        entity: sensor.rte_tempo_prochaine_couleur
        icon_color: white
        card_mod:
          style: |
            ha-card {
              border: none;
              {% set color = states('sensor.rte_tempo_prochaine_couleur') %}
              {% if color == 'Rouge' %}
                background: linear-gradient(135deg, #ff5f6d 0%, #b91d1d 100%);
              {% elif color == 'Blanc' %}
                background: linear-gradient(135deg, #ffffff 0%, #d7e1ec 100%);
                --primary-text-color: #2c3e50;
              {% elif color == 'Bleu' %}
                background: linear-gradient(135deg, #2193b0 0%, #6dd5ed 100%);
              {% else %}
                background: var(--card-background-color);
              {% endif %}
              box-shadow: 0 4px 15px rgba(0,0,0,0.2);
              border-radius: 15px;
              height: 140px;
            }
            ha-state-icon, .primary, .secondary {
              {% if states('sensor.rte_tempo_prochaine_couleur') == 'Blanc' %}
                color: #2c3e50 !important;
              {% else %}
                color: white !important;
              {% endif %}
            }
  - type: custom:mushroom-chips-card
    alignment: center
    chips:
      - type: template
        content: "{{ states('sensor.rte_tempo_cycle_jours_restants_bleu') }}/300"
        icon: mdi:circle
        icon_color: blue
        card_mod:
          style: >-
            ha-card { --chip-border-color: #2193b0; --chip-background: rgba(33,
            147, 176, 0.2); }
      - type: template
        content: "{{ states('sensor.rte_tempo_cycle_jours_restants_blanc') }}/43"
        icon: mdi:circle
        icon_color: "#bdbdbd"
        card_mod:
          style: >-
            ha-card { --chip-border-color: #e0e0e0; --chip-background: rgba(245,
            245, 245, 0.2); }
      - type: template
        content: "{{ states('sensor.rte_tempo_cycle_jours_restants_rouge') }}/22"
        icon: mdi:circle
        icon_color: red
        card_mod:
          style: >-
            ha-card { --chip-border-color: #ff5f6d; --chip-background: rgba(255,
            95, 109, 0.2); }
